# 行銷指標庫（自營品牌單店）
#
# 工具內建、跨專案共用。每個指標寫明：定義、為什麼重要、對應的 Amazon 報表名稱（參考用，
# 定義以這裡為準）、grain、需要哪些資料。專案的 L4 用同樣的名稱定義指標，就算「用了這個指標」。
#
# needs：
#   event：需要的前端事件，在哪個行為時刻送出（moment），必須帶哪些 property（型別與值從哪裡來）
#   source：需要的業務資料來源與欄位
#   metric：需要先有的其他指標（比率）

groups:
  traffic: 流量
  funnel: 商品漏斗
  sales: 銷售
  profit: 獲利
  inventory: 庫存

metrics:
  uv:
    group: traffic
    label: 不重複訪客
    definition: 期間內看過任何頁面的不同的人
    why: 全站的流量規模；比率的分母
    reference: "Amazon Business Reports：Sessions（以 session 計）"
    grain: 期間
    needs:
      - event: page_view
        moment: page_load
        properties: {page_type: {type: string, from: page.type}}

  sessions:
    group: traffic
    label: 造訪次數
    definition: 期間內開始的造訪次數（同一裝置 30 分鐘沒動作算新的一次）
    why: 流量的次數；看活動有沒有把人帶回來
    reference: "Amazon Business Reports：Sessions"
    grain: 期間
    needs:
      - event: page_view
        moment: page_load
        properties: {page_type: {type: string, from: page.type}}

  product_impressions:
    group: funnel
    label: 商品曝光數
    definition: 商品卡片出現在畫面上的次數（首頁精選、分類頁…）
    why: 所有商品指標的起點；沒有曝光，就分不出「沒人要」和「沒人看到」——找潛力商品一定要有
    reference: "Amazon：Impressions（搜尋與廣告報表）"
    grain: 商品 × 期間
    needs:
      - event: product_impression
        moment: product_impression
        properties:
          product_id: {type: string, from: product.id}
          list_name: {type: string, from: list.name}
          position: {type: integer, from: list.position}

  product_detail_views:
    group: funnel
    label: 商品頁瀏覽數
    definition: 商品詳情頁被看的次數
    why: 商品吸引到多少興趣；轉換率的分母
    reference: "Amazon Business Reports：Page Views（依商品）"
    grain: 商品 × 期間
    needs:
      - event: product_view
        moment: product_detail_load
        properties: {product_id: {type: string, from: product.id}}

  product_ctr:
    group: funnel
    label: 商品點擊率
    definition: 商品頁瀏覽 ÷ 商品曝光
    why: 商品卡片（圖、名稱、價格）有沒有吸引力；點擊率高但曝光少，是被埋沒的訊號
    reference: "Amazon：Click-through rate（CTR）"
    grain: 商品 × 期間
    needs:
      - metric: product_detail_views
      - metric: product_impressions

  cart_adds:
    group: funnel
    label: 加入購物車次數
    definition: 成功加入購物車的次數（API 回傳成功才算）
    why: 購買意圖；比下單更早出現的訊號
    reference: "Amazon：Add to cart（品牌分析）"
    grain: 商品 × 期間
    needs:
      - event: add_to_cart
        moment: add_to_cart_success
        properties:
          product_id: {type: string, from: product.id}
          quantity: {type: integer, from: item.quantity}

  add_to_cart_rate:
    group: funnel
    label: 加購率
    definition: 加入購物車次數 ÷ 商品頁瀏覽數
    why: 看了商品頁之後有沒有想買；商品頁（描述、評價、價格）的說服力
    reference: "業界常用：Add-to-cart rate"
    grain: 商品 × 期間
    needs:
      - metric: cart_adds
      - metric: product_detail_views

  orders:
    group: sales
    label: 訂單數
    definition: 後端成立的訂單（不含已取消）
    why: 前端只能證明「收到付款成功」，訂單有沒有成立、之後有沒有取消，只有後端知道
    reference: "Amazon Business Reports：Total Order Items（依訂單計）"
    grain: 期間
    needs:
      - source: orders
        columns: [order_id, status, created_at]

  revenue:
    group: sales
    label: 營收
    definition: 後端訂單的實付金額（扣折扣、含運費），不含已取消的
    why: 和財務對得起來的營收；前端事件帶的金額通常是未扣折扣的購物車金額
    reference: "業界常用：Net sales"
    grain: 期間
    needs:
      - source: orders
        columns: [order_id, status, total, created_at]

  refund_rate:
    group: sales
    label: 退款率
    definition: 退款的訂單 ÷ 成立的訂單
    why: 賣得多但退得也多的商品或活動，其實沒有賺
    reference: "業界常用：Refund rate"
    grain: 期間
    needs:
      - metric: orders
      - source: orders
        columns: [order_id, status, refunded_at]

  units_ordered:
    group: sales
    label: 銷售件數
    definition: 訂單裡這個商品的件數（以後端訂單為準）
    why: 真正賣出多少；選品、補貨的基礎
    reference: "Amazon Business Reports：Units Ordered"
    grain: 商品 × 期間
    needs:
      - source: order_lines
        columns: [product_id, quantity, ordered_at]

  unit_session_percentage:
    group: sales
    label: 商品轉換率
    definition: 銷售件數 ÷ 商品頁瀏覽數
    why: 看過的人有多少真的買；找潛力商品的核心指標
    reference: "Amazon Business Reports：Unit Session Percentage（分母是 sessions，這裡用商品頁瀏覽）"
    grain: 商品 × 期間
    needs:
      - metric: units_ordered
      - metric: product_detail_views

  ordered_product_sales:
    group: sales
    label: 商品營收
    definition: 訂單裡這個商品的金額（單價 × 件數，未扣折扣；以後端訂單為準）
    why: 這個商品帶來多少營收
    reference: "Amazon Business Reports：Ordered Product Sales"
    grain: 商品 × 期間
    needs:
      - source: order_lines
        columns: [product_id, line_revenue, ordered_at]

  gross_margin:
    group: profit
    label: 毛利
    definition: 商品營收 − 件數 × 成本
    why: 賣得多不等於賺得多；選品要以毛利為準
    reference: "業界常用：Gross margin"
    grain: 商品 × 期間
    needs:
      - source: order_lines
        columns: [product_id, quantity, line_revenue, ordered_at]
      - source: products
        columns: [product_id, cost]

  discount_cost:
    group: profit
    label: 折扣成本
    definition: 成立訂單的折扣金額加總（以後端為準）
    why: 折扣碼帶來的營收要扣掉這個成本才知道值不值得；過期或超用的折扣碼會讓成本失控
    reference: "業界常用：Promotion cost"
    grain: 期間
    needs:
      - source: orders
        columns: [order_id, status, discount_amount, coupon_code, created_at]
      - source: coupons
        columns: [coupon_code, valid_from, valid_until, usage_limit]

  margin_rate:
    group: profit
    label: 毛利率
    definition: 毛利 ÷ 商品營收
    why: 每賣一塊錢賺多少；推高毛利率的商品比推高營收的商品更划算
    reference: "業界常用：Gross margin %"
    grain: 商品 × 期間
    needs:
      - metric: gross_margin
      - metric: ordered_product_sales

  stockout_days:
    group: inventory
    label: 缺貨天數
    definition: 一天結束時可售庫存為 0 的天數
    why: 缺貨會讓轉換率看起來變差、也會讓推薦落空；推一個快缺貨的商品是浪費曝光
    reference: "業界常用：Out-of-stock days"
    grain: 商品 × 期間
    needs:
      - source: inventory_daily
        columns: [date, product_id, on_hand]
