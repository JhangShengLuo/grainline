[project]
name = "grainline-api"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "duckdb>=1.1",
    "pydantic>=2.6",
    "pyyaml>=6",
    "tzdata>=2024.1",
    "anthropic>=1.0",
    "jsonschema>=4.20",
    # Apache Ossie 官方的 Ossie ↔ Cube 轉換器（還沒發佈到 PyPI，鎖定 commit）
    "apache-ossie-cube @ https://github.com/apache/ossie/archive/e49a0f0ca2336669ba22662853eba63bff3ce8d1.tar.gz#subdirectory=converters/cube",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.library", "app.standards"]

[tool.setuptools.package-data]
"app.library" = ["*.yaml"]
"app.standards" = ["*.json", "*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
grainline = "app.cli:main"
