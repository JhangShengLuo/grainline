version: 1
name: 現行埋點
events:
  page_view:
    params: [page, utm_source, utm_medium, utm_campaign]
    when: 每次頁面載入；utm 只在從廣告進站的第一頁
  list_view:
    params: [page, list, items]
    when: 商品列表顯示；items 是這次看到的商品陣列
  product_view:
    params: [page, sku, cat, price]
    when: 商品頁載入
  add_to_cart:
    params: [sku, qty, price]
    when: 加入購物車成功
  purchase:
    params: [value]
    when: 付款完成頁
