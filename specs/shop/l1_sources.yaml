# L1 業務資料來源 — 不是前端事件，由各系統的擁有者提供
#
# 和前端事件一樣是合約：宣告 grain（一列代表什麼）、欄位型別、擁有者。
# 銷量、營收、成本、庫存的真實來源都在這裡，不該從前端事件推算。
# identity：哪些欄位可以對到前端的人；有的話 L2 會用同一套身分規則加上 person_id。
# 欄位型別：string / integer / number / boolean / timestamp / date
# rules（R4 業務規則）：reference 參照完整性、within 有效期間、limit 次數上限、match 金額對帳，每條都寫為什麼

products:
  owner: 商品／營運
  description: 商品目錄，每個商品一列
  grain: [product_id]
  columns:
    product_id: {type: string, description: 商品編號}
    name: {type: string, description: 商品名稱}
    category: {type: string, description: 商品分類}
    price: {type: number, description: 售價（新台幣）}
    cost: {type: number, description: 成本（新台幣）}
    launch_date: {type: date, description: 上架日}
    legacy_rank: {type: integer, description: 目前的陳列排序（首頁精選與分類頁順序依此）}

order_lines:
  owner: 後端
  description: 訂單明細，每張訂單的每個商品一列（以後端建立訂單為準）
  grain: [order_id, line_no]
  identity: {anonymous_id: anonymous_id, user_id: user_id}
  columns:
    order_id: {type: string, description: 訂單編號}
    line_no: {type: integer, description: 第幾個品項}
    product_id: {type: string, description: 商品編號}
    quantity: {type: integer, description: 數量}
    unit_price: {type: number, description: 單價}
    line_revenue: {type: number, description: 品項金額（單價 × 數量，未扣折扣）}
    coupon_code: {type: string, description: 折扣碼}
    ordered_at: {type: timestamp, description: 訂單建立時間}
    anonymous_id: {type: string, description: 下單裝置（結帳時由前端帶給後端）}
    user_id: {type: string, description: 會員帳號}

inventory_daily:
  owner: 倉儲
  description: 每天結束時的庫存，每個商品每天一列
  grain: [date, product_id]
  columns:
    date: {type: date, description: 日期}
    product_id: {type: string, description: 商品編號}
    on_hand: {type: integer, description: 可售庫存}

orders:
  owner: 後端
  description: 訂單主檔，每張訂單一列（訂單數、營收以這裡為準）
  grain: [order_id]
  identity: {anonymous_id: anonymous_id, user_id: user_id}
  columns:
    order_id: {type: string, description: 訂單編號}
    anonymous_id: {type: string, description: 下單裝置}
    user_id: {type: string, description: 會員帳號}
    platform: {type: string, description: 下單通路（web / app）}
    status: {type: string, description: 訂單狀態（paid 已付款 / cancelled 已取消 / refunded 已退款）}
    item_count: {type: integer, description: 件數}
    subtotal: {type: number, description: 商品金額（未扣折扣）}
    discount_amount: {type: number, description: 折扣金額}
    shipping_fee: {type: number, description: 運費}
    total: {type: number, description: 實付金額（商品金額 − 折扣 + 運費）}
    coupon_code: {type: string, description: 使用的折扣碼}
    created_at: {type: timestamp, description: 訂單建立時間}
    cancelled_at: {type: timestamp, description: 取消時間}
    refunded_at: {type: timestamp, description: 退款時間}
  rules:
    - {type: reference, column: coupon_code, to: coupons.coupon_code, why: 訂單上的折扣碼必須存在於折扣碼主檔}
    - {type: match, key: order_id, column: discount_amount, source: coupon_redemptions, other_column: discount_amount, why: 訂單的折扣金額要等於折扣碼使用紀錄的金額}

coupons:
  owner: 行銷
  description: 折扣碼主檔，每個折扣碼一列
  grain: [coupon_code]
  columns:
    coupon_code: {type: string, description: 折扣碼}
    campaign: {type: string, description: 活動}
    discount_type: {type: string, description: 折扣類型（percent 打折 / fixed 折抵金額）}
    value: {type: number, description: 折扣（percent 時是 %，fixed 時是金額）}
    min_spend: {type: number, description: 最低消費}
    valid_from: {type: date, description: 開始日}
    valid_until: {type: date, description: 結束日}
    usage_limit: {type: integer, description: 總使用次數上限}
    per_user_limit: {type: integer, description: 每人使用次數上限}

coupon_redemptions:
  owner: 後端
  description: 折扣碼使用紀錄，每次使用一列
  grain: [redemption_id]
  identity: {anonymous_id: anonymous_id, user_id: user_id}
  columns:
    redemption_id: {type: string, description: 使用紀錄編號}
    coupon_code: {type: string, description: 折扣碼}
    order_id: {type: string, description: 訂單編號}
    user_id: {type: string, description: 會員帳號}
    anonymous_id: {type: string, description: 下單裝置}
    redeemed_at: {type: timestamp, description: 使用時間}
    discount_amount: {type: number, description: 折了多少錢}
    status: {type: string, description: applied 已使用 / reversed 訂單取消已沖銷}
    reversed_at: {type: timestamp, description: 沖銷時間}
  rules:
    - {type: reference, column: coupon_code, to: coupons.coupon_code, why: 使用的折扣碼必須存在於折扣碼主檔}
    - {type: reference, column: order_id, to: orders.order_id, why: 每次使用都要對到一張訂單}
    - {type: within, time: redeemed_at, key: coupon_code, source: coupons, start: valid_from, end: valid_until, why: 只能在折扣碼的有效期間內使用}
    - type: limit
      group_by: [coupon_code]
      key: coupon_code
      source: coupons
      max: usage_limit
      filter: {column: status, op: eq, value: applied}
      why: 總使用次數不能超過上限
    - type: limit
      group_by: [coupon_code, user_id]
      key: coupon_code
      source: coupons
      max: per_user_limit
      filter: {column: status, op: eq, value: applied}
      why: 每個會員的使用次數不能超過上限
