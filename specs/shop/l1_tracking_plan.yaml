# L1 事件契約（Tracking Plan）— 擁有者：前端、PM
#
# 每個事件都會自動帶信封欄位，不需要在這裡宣告：
#   event_id, event_name, timestamp（台北時間）, anonymous_id（裝置）, user_id（登入後才有）, tracking_plan_version
# property 型別：string / integer / number / boolean；string 可以加 enum。

version: 1

common_properties:
  platform:
    type: string
    enum: [web, app]
    description: 事件來源平台

events:
  page_view:
    description: 使用者看到一個頁面
    trigger: 頁面載入完成（SPA 切換路由也算）
    properties:
      page_type:
        type: string
        enum: [home, category, product, cart, checkout]

  product_view:
    description: 使用者看到商品詳情
    trigger: 商品詳情頁載入完成
    properties:
      product_id: {type: string}
      price: {type: number, min: 0, description: 當下售價（新台幣）}

  add_to_cart:
    description: 商品加入購物車
    trigger: 點擊「加入購物車」且 API 回傳成功
    properties:
      product_id: {type: string}
      price: {type: number, min: 0}
      quantity: {type: integer, min: 1, max: 99}

  checkout_start:
    description: 進入結帳流程
    trigger: 結帳頁載入完成
    properties:
      cart_value: {type: number, min: 0}
      item_count: {type: integer, min: 1}

  order_completed:
    description: 訂單成立
    trigger: 付款成功頁載入（以後端建立訂單為準）
    properties:
      order_id: {type: string}
      revenue: {type: number, min: 0, description: 訂單金額（新台幣，未扣折扣）}
      item_count: {type: integer, min: 1}

  login:
    description: 登入成功
    trigger: 登入 API 回傳成功，之後的事件都會帶 user_id
    properties:
      method:
        type: string
        enum: [email, google, line]
