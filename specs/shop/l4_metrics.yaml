# L4 指標與報表 — 擁有者：BI、行銷
#
# simple metric：model + time_column + measure + 可加性
#   additivity:
#     additive       可以跨時間、跨維度直接加總（例：訂單數、營收）
#     semi_additive  可跨維度加總，但不能跨時間加總（例：庫存、會員數快照）
#     non_additive   不能加總（例：不重複人數、比率）
# 指標名稱和內建的行銷指標庫（api/app/library/marketing.yaml）相同時，就算用了指標庫的定義，
# console 的「指標庫」頁會檢查做法是否一致、還缺哪些資料。
#
# ratio metric：numerator / denominator，必定 non_additive。
#   kind: rate      分子必須是分母的子集（例：轉換率）
#   kind: per_unit  每單位平均，分子分母來自同一個 model、同樣的篩選（例：客單價）
#   kind: funnel    漏斗下一步 ÷ 上一步，不保證子集，單一商品可能 > 1（例：點擊率）
#   報表會先在報表的 grain 上分別算出分子、分母，再相除，不會對比率本身做加總。
# rollup metric：先在 from_grain 算出 of，再用 agg 彙總到報表的 grain（只有 of 可加時才正確）
# report：metrics × dimensions × time_grain（day / week / month），編譯成 rpt_<name> view

metrics:
  uv:
    label: 不重複訪客
    model: fct_page_views
    time_column: ts
    measure: {agg: count_distinct, column: person_id}
    additivity: non_additive

  page_views:
    label: 頁面瀏覽數
    model: fct_page_views
    time_column: ts
    measure: {agg: count}
    additivity: additive

  sessions:
    label: 造訪次數
    model: dim_sessions
    time_column: started_at
    measure: {agg: count}
    additivity: additive

  product_views:
    label: 商品瀏覽數
    model: fct_product_views
    time_column: ts
    measure: {agg: count}
    additivity: additive

  cart_adds:
    label: 加入購物車次數
    model: fct_cart_adds
    time_column: ts
    measure: {agg: count}
    additivity: additive

  cart_adders:
    label: 加入購物車人數
    model: fct_cart_adds
    time_column: ts
    measure: {agg: count_distinct, column: person_id}
    additivity: non_additive

  # ---------- 訂單（以後端訂單主檔為準；前端回報的只用來對帳）----------

  orders_created:
    label: 建立的訂單數
    description: 後端建立的所有訂單（含之後取消、退款的）
    model: fct_orders
    time_column: created_at
    measure: {agg: count}
    additivity: additive

  orders:
    label: 訂單數
    description: 後端訂單，不含已取消的
    model: fct_orders
    time_column: created_at
    measure: {agg: count}
    additivity: additive
    filters:
      - {column: status, op: in, value: [paid, refunded]}

  refunded_orders:
    label: 退款訂單數
    model: fct_orders
    time_column: created_at
    measure: {agg: count}
    additivity: additive
    filters:
      - {column: status, op: in, value: [paid, refunded]}
      - {column: status, op: eq, value: refunded}

  revenue:
    label: 營收
    description: 後端訂單的實付金額（扣折扣、含運費），不含已取消的
    model: fct_orders
    time_column: created_at
    measure: {agg: sum, column: total}
    additivity: additive
    filters:
      - {column: status, op: in, value: [paid, refunded]}

  order_subtotal:
    label: 訂單商品金額
    description: 後端所有訂單的商品金額（未扣折扣、不含運費、含之後取消的），和前端回報的金額同一個口徑
    model: fct_orders
    time_column: created_at
    measure: {agg: sum, column: subtotal}
    additivity: additive

  discount_cost:
    label: 折扣成本
    model: fct_orders
    time_column: created_at
    measure: {agg: sum, column: discount_amount}
    additivity: additive
    filters:
      - {column: status, op: in, value: [paid, refunded]}

  buyers:
    label: 購買人數
    model: fct_orders
    time_column: created_at
    measure: {agg: count_distinct, column: person_id}
    additivity: non_additive
    filters:
      - {column: status, op: in, value: [paid, refunded]}

  coupon_redemptions:
    label: 折扣碼使用次數
    model: fct_coupon_redemptions
    time_column: redeemed_at
    measure: {agg: count}
    additivity: additive
    filters:
      - {column: status, op: eq, value: applied}

  orders_reported:
    label: 訂單數（前端回報）
    description: 前端送出 order_completed 的次數；只代表前端收到付款成功，用來和後端對帳
    model: fct_order_events
    time_column: ts
    measure: {agg: count}
    additivity: additive

  revenue_reported:
    label: 訂單金額（前端回報）
    description: 前端事件帶的金額（購物車金額，未扣折扣、不含運費）
    model: fct_order_events
    time_column: ts
    measure: {agg: sum, column: revenue}
    additivity: additive

  conversion_rate:
    type: ratio
    label: 購買轉換率
    description: 購買人數 / 不重複訪客（同一個人、同一個期間）
    numerator: buyers
    denominator: uv

  aov:
    type: ratio
    kind: per_unit
    label: 平均訂單金額
    numerator: revenue
    denominator: orders

  refund_rate:
    type: ratio
    label: 退款率
    numerator: refunded_orders
    denominator: orders

  web_uv:
    label: Web 不重複訪客
    model: fct_page_views
    time_column: ts
    measure: {agg: count_distinct, column: person_id}
    additivity: non_additive
    filters:
      - {column: platform, op: eq, value: web}

  # ⚠ 刻意放的衝突（R1 可加性）：把每日 UV 加起來當週 UV，同一個人在一週內來好幾天就被算好幾次
  weekly_uv_from_daily:
    type: rollup
    label: 週 UV（日 UV 加總）
    of: uv
    from_grain: day
    agg: sum

  # ⚠ 刻意放的衝突（R2 比率母體）：分母只算 web，分子忘了加 platform = web，會把 app 的買家也算進來
  web_conversion_rate:
    type: ratio
    label: Web 購買轉換率
    numerator: buyers
    denominator: web_uv

  # ---------- 商品（grain：商品 × 期間，報表用 product_id 當維度）----------

  product_impressions:
    label: 商品曝光數
    model: fct_product_impressions
    time_column: ts
    measure: {agg: count}
    additivity: additive

  product_detail_views:
    label: 商品頁瀏覽數
    model: fct_product_views
    time_column: ts
    measure: {agg: count}
    additivity: additive

  product_ctr:
    type: ratio
    kind: funnel
    label: 商品點擊率
    numerator: product_detail_views
    denominator: product_impressions

  add_to_cart_rate:
    type: ratio
    kind: funnel
    label: 加購率
    numerator: cart_adds
    denominator: product_detail_views

  units_ordered:
    label: 銷售件數
    model: fct_order_lines
    time_column: ordered_at
    measure: {agg: sum, column: quantity}
    additivity: additive
    filters:
      - {column: order_status, op: neq, value: cancelled}

  unit_session_percentage:
    type: ratio
    kind: funnel
    label: 商品轉換率
    description: 銷售件數 ÷ 商品頁瀏覽數
    numerator: units_ordered
    denominator: product_detail_views

  ordered_product_sales:
    label: 商品營收
    model: fct_order_lines
    time_column: ordered_at
    measure: {agg: sum, column: line_revenue}
    additivity: additive
    filters:
      - {column: order_status, op: neq, value: cancelled}

  gross_margin:
    label: 毛利
    model: fct_order_lines
    time_column: ordered_at
    measure: {agg: sum, column: gross_margin}
    additivity: additive
    filters:
      - {column: order_status, op: neq, value: cancelled}

  margin_rate:
    type: ratio
    kind: per_unit
    label: 毛利率
    numerator: gross_margin
    denominator: ordered_product_sales

  stockout_days:
    label: 缺貨天數
    model: fct_inventory_daily
    time_column: date
    measure: {agg: count}
    additivity: additive
    filters:
      - {column: on_hand, op: eq, value: 0}

reports:
  daily_overview:
    label: 每日總覽
    time_grain: day
    metrics: [uv, sessions, page_views, cart_adds, orders, revenue, conversion_rate, aov, refund_rate]

  weekly_by_platform:
    label: 各平台每週表現
    time_grain: week
    dimensions: [platform]
    metrics: [uv, cart_adders, buyers, conversion_rate, revenue]

  marketing_weekly:
    label: 行銷週報
    time_grain: week
    metrics: [uv, weekly_uv_from_daily, web_uv, web_conversion_rate]

  promotion_weekly:
    label: 折扣碼成效週報
    time_grain: week
    dimensions: [coupon_code]
    metrics: [orders, revenue, discount_cost]

  frontend_vs_backend:
    label: 前端事件 vs 後端資料
    time_grain: day
    metrics: [orders_reported, orders_created, revenue_reported, order_subtotal, orders, revenue]

  product_weekly:
    label: 商品每週表現
    time_grain: week
    dimensions: [product_id]
    metrics: [product_impressions, product_detail_views, product_ctr, cart_adds, add_to_cart_rate, units_ordered, unit_session_percentage, ordered_product_sales, gross_margin, margin_rate, stockout_days]

# R4 對帳：前端回報的數字和後端的真實數字，差距超過 tolerance 就警告
reconciliations:
  - label: 訂單數：前端回報 vs 後端建立
    reported: orders_reported
    truth: orders_created
    tolerance: 0.02
    why: 每張後端建立的訂單，前端都應該回報一次；差太多代表漏記或重複記錄
  - label: 訂單金額：前端回報 vs 後端商品金額
    reported: revenue_reported
    truth: order_subtotal
    tolerance: 0.02
    why: 前端回報的是購物車金額，應該等於後端訂單的商品金額
