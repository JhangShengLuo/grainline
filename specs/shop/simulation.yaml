# 合成資料設定 — 只產生假資料
#
# 模擬的是「使用者行為」，不是事件：每個行為產生一或多個行為時刻（moment），
# 再由 tracking plan 的 fires_on 決定送出哪些事件。所以同樣的行為，換一份 tracking plan 會得到不同的事件。
#
# 行為與它產生的時刻：
#   view_home        → page_load(home)，首頁精選的每張卡片 product_impression
#   browse_category  → page_load(category)，分類頁往下看到的每張卡片 product_impression
#   view_product     → page_load(product)、product_detail_load（從看過的卡片裡，依真實吸引力與位置挑）
#   add_to_cart   → 每個看過的商品依真實轉換傾向決定要不要加購：add_to_cart_click，
#                   有庫存且 API 成功的話再 add_to_cart_success
#   checkout      → page_load(checkout)、checkout_load
#   purchase      → 後端先建立訂單（驗證折扣碼、算折扣與運費、寫入訂單主檔與明細、扣庫存），
#                   然後 payment_success，到達成功頁的話 order_complete_page_load（可能重新整理再一次）；
#                   之後訂單可能取消或退款
# 有帳號的人在第一步之後可能登入 → login_success
#
# 每個 visitor 依 persona 權重抽樣；session 數 ~ Poisson(sessions_per_week × days / 7)
# 第 2 步之後依 persona 的 continue 機率決定是否繼續

seed: 42
start_date: 2026-09-01
days: 28
visitors: 1500

catalog:
  size: 60
  price_min: 199
  price_max: 4990
  cost_ratio: [0.4, 0.7]

# 市場的真相：每個商品有真實的吸引力、轉換傾向、趨勢、庫存；報表看不到，只用來評估選品準不準。
# 首頁精選與分類頁排序依「舊排序」（products.legacy_rank），不看真實品質，所以有好商品被埋沒。
market:
  featured_slots: 8          # 首頁精選版位
  list_depth: [6, 20]        # 使用者在分類頁往下看幾個商品
  position_decay: 0.85       # 每往後一個位置，被點的機率乘上這個數
  add_to_cart_base: 0.3      # 轉換傾向 1.0 的商品，看了之後加購的機率
  attractiveness_sigma: 0.6
  conversion_sigma: 0.6
  rising_share: 0.1          # 10% 的商品人氣在這段期間上升
  rising_growth: 1.0         # 上升的商品在期間結束時吸引力是兩倍
  initial_stock: [30, 300]
  restock_days: 7

# 有帳號的人在每個 session 第一步之後，有這個機率登入；登入過的裝置會保持登入
login:
  rate_per_session: 0.5
  methods: [email, google, line]

# 和埋點無關、真實世界會發生的事
behavior:
  add_to_cart_api_success: 0.9      # 加入購物車 API 有 10% 會失敗（庫存不足、逾時）
  coupon_rate: 0.35                 # 35% 的人結帳時輸入折扣碼（後端驗證不過就不折）
  complete_page_reached: 0.92       # 8% 的人付款成功後沒等到成功頁就離開
  complete_page_reload_rate: 0.06   # 6% 的人在成功頁重新整理
  cancel_rate: 0.03                 # 3% 的訂單在兩天內取消
  refund_rate: 0.04                 # 4% 的訂單出貨後退款
  free_shipping_over: 999
  shipping_fee: 60

# 折扣碼（後端的折扣碼主檔由這裡產生）；SUMMER15 在 9/7 就過期了
coupons:
  - {code: FALL10, campaign: 秋季活動, discount_type: percent, value: 10, min_spend: 0, valid_from: 2026-09-01, valid_until: 2026-09-30, usage_limit: 400, per_user_limit: 2}
  - {code: VIP200, campaign: 會員專屬, discount_type: fixed, value: 200, min_spend: 1500, valid_from: 2026-08-01, valid_until: 2026-12-31, usage_limit: 60, per_user_limit: 1}
  - {code: APP50, campaign: App 下載, discount_type: fixed, value: 50, min_spend: 500, valid_from: 2026-09-01, valid_until: 2026-10-31, usage_limit: 1000, per_user_limit: 1}
  - {code: SUMMER15, campaign: 夏季活動, discount_type: percent, value: 15, min_spend: 0, valid_from: 2026-07-01, valid_until: 2026-09-07, usage_limit: 500, per_user_limit: 2}

# 刻意模擬的後端 bug，用來示範 R4 業務規則抓得到什麼
backend_bugs:
  accept_expired_coupon: 0.6        # 過期的折扣碼有 60% 的機會還是被接受
  skip_per_user_limit: 0.5          # 每人使用上限有一半的時候沒檢查

funnel:
  - action: view_home
  - action: browse_category
    optional: true
  - action: view_product
    repeat: [1, 4]
  - action: add_to_cart
  - action: checkout
  - action: purchase

personas:
  window_shopper:
    weight: 0.6
    sessions_per_week: 1.0
    has_account_rate: 0.2
    platforms: [web]
    continue: {browse_category: 0.5, view_product: 0.7, add_to_cart: 0.5, checkout: 0.3, purchase: 0.4}
  regular:
    weight: 0.3
    sessions_per_week: 2.5
    has_account_rate: 0.7
    platforms: [web, app]
    continue: {browse_category: 0.6, view_product: 0.85, add_to_cart: 0.8, checkout: 0.6, purchase: 0.7}
  loyal_app:
    weight: 0.1
    sessions_per_week: 4.0
    has_account_rate: 1.0
    platforms: [app]
    continue: {browse_category: 0.7, view_product: 0.9, add_to_cart: 0.9, checkout: 0.75, purchase: 0.85}
