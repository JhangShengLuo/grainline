# 合成資料設定 — 只產生假資料
#
# 模擬的是「使用者行為」，不是事件：每個行為產生一或多個行為時刻（moment），
# 再由 tracking plan 的 fires_on 決定送出哪些事件。所以同樣的行為，換一份 tracking plan 會得到不同的事件。
#
# 行為與它產生的時刻：
#   view_home     → page_load(home)
#   view_product  → page_load(product)、product_detail_load
#   add_to_cart   → add_to_cart_click，API 成功的話再 add_to_cart_success
#   checkout      → page_load(checkout)、checkout_load
#   purchase      → payment_success，到達成功頁的話 order_complete_page_load（可能重新整理再一次）
# 有帳號的人在第一步之後可能登入 → login_success
#
# 每個 visitor 依 persona 權重抽樣；session 數 ~ Poisson(sessions_per_week × days / 7)
# 第 2 步之後依 persona 的 continue 機率決定是否繼續

seed: 42
start_date: 2026-09-01
days: 28
visitors: 1500

catalog:
  size: 60
  price_min: 199
  price_max: 4990

# 有帳號的人在每個 session 第一步之後，有這個機率登入；登入過的裝置會保持登入
login:
  rate_per_session: 0.5
  methods: [email, google, line]

# 和埋點無關、真實世界會發生的事
behavior:
  add_to_cart_api_success: 0.9      # 加入購物車 API 有 10% 會失敗（庫存不足、逾時）
  coupon_rate: 0.3                  # 30% 的訂單用了折扣碼
  coupon_codes: [FALL10, VIP200, APP50]
  complete_page_reached: 0.92       # 8% 的人付款成功後沒等到成功頁就離開
  complete_page_reload_rate: 0.06   # 6% 的人在成功頁重新整理

funnel:
  - action: view_home
  - action: view_product
    repeat: [1, 4]
  - action: add_to_cart
    repeat: [1, 2]
  - action: checkout
  - action: purchase

personas:
  window_shopper:
    weight: 0.6
    sessions_per_week: 1.0
    has_account_rate: 0.2
    platforms: [web]
    continue: {view_product: 0.7, add_to_cart: 0.15, checkout: 0.3, purchase: 0.4}
  regular:
    weight: 0.3
    sessions_per_week: 2.5
    has_account_rate: 0.7
    platforms: [web, app]
    continue: {view_product: 0.85, add_to_cart: 0.35, checkout: 0.6, purchase: 0.7}
  loyal_app:
    weight: 0.1
    sessions_per_week: 4.0
    has_account_rate: 1.0
    platforms: [app]
    continue: {view_product: 0.9, add_to_cart: 0.5, checkout: 0.75, purchase: 0.85}
